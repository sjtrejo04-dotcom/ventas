[variables]
# Configura el directorio público para Nginx
NIXPACKS_PHP_ROOT_DIR = "/app/public"
NIXPACKS_NODE_VERSION = "20"

[phases.install]
# Forzamos la instalación de NPM eliminando el lockfile y limpiando la caché (Railway guarda node_modules entre builds)
cmds = [
    "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader",
    "rm -rf node_modules package-lock.json",
    "npm cache clean --force",
    "npm install --force"
]

[phases.build]
# Se ejecuta durante la construcción de la imagen en Railway
cmds = [
    "npm run build",
    "mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache storage/logs bootstrap/cache",
    "chmod -R 777 storage bootstrap/cache"
]
