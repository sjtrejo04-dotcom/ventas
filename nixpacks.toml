[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.install]
cmds = [
    "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader",
    "npm ci",
    "npm install @rolldown/binding-linux-x64-gnu --no-save"
]

[phases.build]
# Se ejecuta durante la construcción de la imagen en Railway
cmds = [
    "npm run build",
    "mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache storage/logs bootstrap/cache /var/log/nginx",
    "chmod -R 777 storage bootstrap/cache /var/log/nginx"
]
